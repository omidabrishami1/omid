<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productivity Nexus</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: { 850: '#1e293b', 900: '#0f172a', 950: '#020617' },
            brand: { 500: '#3b82f6', 400: '#60a5fa' },
            accent: { 500: '#10b981', 400: '#34d399' }
          }
        }
      }
    }
  </script>

  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Libraries Import Map -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.263.1",
      "recharts": "https://esm.sh/recharts@2.12.0"
    }
  }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import ReactDOM from 'react-dom/client';
    import { 
      LayoutDashboard, PlusCircle, Settings, Menu, X, BarChart3, Save, RotateCcw,
      Activity, Battery, Moon, Smartphone, TrendingUp, Calendar, Monitor, BookOpen, Weight, Clock, Dumbbell, Scale, ArrowRightLeft
    } from 'lucide-react';
    import { 
      LineChart, Line, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, BarChart, Bar, Legend
    } from 'recharts';

    // ==========================================
    // 1. CONSTANTS & CONFIG
    // ==========================================
    const DEFAULT_CONFIG = {
      workWeight: 10,
      exerciseWeight: 1,
      studyWeight: 1.5,
      phonePenalty: 0.5,
      sleepTarget: 8,
      sleepWeight: 20,
      dailyTargetScore: 150
    };
    const MOCK_HISTORY_LENGTH = 30;

    // ==========================================
    // 2. UTILS: JALALI DATE CONVERTER
    // ==========================================
    const breaks =  [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
    const div = (a, b) => ~~(a / b);
    const mod = (a, b) => a - ~~(a / b) * b;

    function toJalaali(gy, gm, gd) {
      if (gy > 1600) { var jy = 979; var gy2 = gy - 1600; } else { var jy = 0; var gy2 = gy - 621; }
      var gy3 = (gm > 2) ? (gy2 + 1) : gy2;
      var days = (365 * gy2) + div(gy3 + 3, 4) - div(gy3 + 99, 100) + div(gy3 + 399, 400) - 80 + gd + [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334][gm - 1];
      var jy2 = jy + 33 * div(days, 12053);
      var days2 = mod(days, 12053);
      var jy3 = jy2 + 4 * div(days2, 1461);
      var days3 = mod(days2, 1461);
      if (days3 > 365) { var jy4 = jy3 + div(days3 - 1, 365); var days4 = mod(days3 - 1, 365); } else { var jy4 = jy3; var days4 = days3; }
      var jm, jd;
      if (days4 < 186) { jm = 1 + div(days4, 31); jd = 1 + mod(days4, 31); } else { jm = 7 + div(days4 - 186, 30); jd = 1 + mod(days4 - 186, 30); }
      return { jy: jy4, jm: jm, jd: jd };
    }

    function toGregorian(jy, jm, jd) {
      if (jy > 979) { var gy = 1600; var jy2 = jy - 979; } else { var gy = 621; var jy2 = jy; }
      var days = (365 * jy2) + (div(jy2, 33) * 8) + div(mod(jy2, 33) + 3, 4) + 78 + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
      var gy2 = 400 * div(days, 146097);
      var days2 = mod(days, 146097);
      if (days2 > 36524) { var gy3 = gy2 + 100 * div(days2 - 1, 36524); var days3 = mod(days2 - 1, 36524); } else { var gy3 = gy2; var days3 = days2; }
      var gy4 = gy3 + 4 * div(days3, 1461);
      var days4 = mod(days3, 1461);
      if (days4 > 365) { var gy5 = gy4 + div(days4 - 1, 365); var days5 = mod(days4 - 1, 365); } else { var gy5 = gy4; var days5 = days4; }
      var gd = days5 + 1;
      var gm, sal_a = [0, 31, ((gy5 % 4 === 0 && gy5 % 100 !== 0) || (gy5 % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      for (gm = 0; gm < 13; gm++) { var v = sal_a[gm]; if (gd <= v) break; gd -= v; }
      return { gy: gy + gy5, gm: gm, gd: gd };
    }

    const formatJalali = (jy, jm, jd) => `${jy}/${jm.toString().padStart(2, '0')}/${jd.toString().padStart(2, '0')}`;
    
    const gregorianToJalaliString = (dateStr) => {
      if (!dateStr) return '';
      const [gYear, gMonth, gDay] = dateStr.split('-').map(Number);
      const { jy, jm, jd } = toJalaali(gYear, gMonth, gDay);
      return formatJalali(jy, jm, jd);
    };

    // ==========================================
    // 3. UTILS: CALCULATIONS
    // ==========================================
    const calculateDuration = (start, end) => {
      if (!start || !end) return 0;
      const [startH, startM] = start.split(':').map(Number);
      const [endH, endM] = end.split(':').map(Number);
      let diffInMinutes = (endH * 60 + endM) - (startH * 60 + startM);
      if (diffInMinutes < 0) diffInMinutes += 24 * 60;
      return parseFloat((diffInMinutes / 60).toFixed(2));
    };

    const calculateDailyScore = (data, config) => {
      let score = 0;
      score += data.workHours * config.workWeight;
      score += data.exerciseMinutes * config.exerciseWeight;
      score += data.studyMinutes * config.studyWeight;
      score -= data.phoneMinutes * config.phonePenalty;
      
      if (data.sleepHours >= 7 && data.sleepHours <= 9) {
        score += config.sleepWeight;
      } else if (data.sleepHours > 0) {
        score += config.sleepWeight * 0.5;
      }

      let percentage = (score / config.dailyTargetScore) * 100;
      percentage = Math.max(0, Math.min(percentage, 100));

      let grade = 'F';
      if (percentage >= 100) grade = 'S';
      else if (percentage >= 90) grade = 'A';
      else if (percentage >= 75) grade = 'B';
      else if (percentage >= 60) grade = 'C';
      else if (percentage >= 40) grade = 'D';

      return {
        totalScore: Math.round(score),
        productivityPercentage: Math.round(percentage),
        grade
      };
    };

    const generateMockData = (days) => {
      const data = [];
      const today = new Date();
      for (let i = days - 1; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        
        const work = 6 + Math.random() * 4;
        const exercise = Math.random() > 0.5 ? 30 + Math.random() * 60 : 0;
        
        data.push({
          id: dateStr,
          date: dateStr,
          jalaliDate: gregorianToJalaliString(dateStr),
          sleepTime: "23:00",
          wakeTime: "07:00",
          sleepHours: 8,
          workHours: parseFloat(work.toFixed(1)),
          exerciseMinutes: Math.round(exercise),
          studyMinutes: Math.round(Math.random() * 60),
          phoneMinutes: Math.round(30 + Math.random() * 90),
          weight: parseFloat((75 + Math.sin(i / 5) * 1.5).toFixed(1)),
          notes: ""
        });
      }
      return data;
    };

    // ==========================================
    // 4. COMPONENTS
    // ==========================================

    // --- StatCard ---
    const StatCard = ({ title, value, subtitle, icon: Icon, colorClass = "text-brand-400" }) => (
      <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow">
        <div className="flex justify-between items-start">
          <div>
            <p className="text-slate-400 text-sm font-medium">{title}</p>
            <h3 className="text-2xl font-bold text-white mt-1">{value}</h3>
            {subtitle && <p className="text-xs text-slate-500 mt-1">{subtitle}</p>}
          </div>
          <div className={`p-2 rounded-lg bg-slate-700/50 ${colorClass}`}>
            <Icon size={20} />
          </div>
        </div>
      </div>
    );

    // --- Dashboard ---
    const Dashboard = ({ data, config }) => {
      const [range, setRange] = useState('14d');

      const processedData = useMemo(() => {
        const sorted = [...data].sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
        const days = range === '7d' ? 7 : range === '14d' ? 14 : 30;
        const filtered = sorted.slice(-days);

        return filtered.map(day => {
          const stats = calculateDailyScore(day, config);
          let jalali = day.jalaliDate || gregorianToJalaliString(day.date);
          const shortJalali = jalali.split('/').slice(1).join('/');

          return {
            ...day,
            score: stats.totalScore,
            productivity: stats.productivityPercentage,
            grade: stats.grade,
            formattedDate: shortJalali,
            fullJalali: jalali
          };
        });
      }, [data, range, config]);

      const historyData = useMemo(() => {
        return [...processedData].sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
      }, [processedData]);

      const averages = useMemo(() => {
        if (processedData.length === 0) return null;
        const sum = processedData.reduce((acc, curr) => ({
          score: acc.score + curr.score,
          prod: acc.prod + curr.productivity,
          work: acc.work + curr.workHours,
          phone: acc.phone + curr.phoneMinutes,
          sleep: acc.sleep + curr.sleepHours,
        }), { score: 0, prod: 0, work: 0, phone: 0, sleep: 0 });
        
        const count = processedData.length;
        return {
          score: Math.round(sum.score / count),
          prod: Math.round(sum.prod / count),
          work: (sum.work / count).toFixed(1),
          phone: Math.round(sum.phone / count),
          sleep: (sum.sleep / count).toFixed(1)
        };
      }, [processedData]);

      const latestWeight = processedData.length > 0 ? processedData[processedData.length - 1].weight : 0;
      const prevWeight = processedData.length > 1 ? processedData[0].weight : latestWeight;
      const weightChange = (latestWeight - prevWeight).toFixed(1);

      return (
        <div className="space-y-6 pb-20">
          <div className="flex justify-between items-center">
            <h2 className="text-xl font-bold text-slate-100">Performance Overview</h2>
            <div className="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
              {['7d', '14d', '30d'].map((r) => (
                <button
                  key={r}
                  onClick={() => setRange(r)}
                  className={`px-3 py-1 text-sm rounded-md transition-all ${
                    range === r ? 'bg-brand-500 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-700'
                  }`}
                >
                  {r.toUpperCase()}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <StatCard title="Productivity" value={`${averages?.prod || 0}%`} icon={Activity} colorClass="text-emerald-400" />
            <StatCard title="Avg Score" value={averages?.score || 0} icon={TrendingUp} colorClass="text-brand-400" />
            <StatCard title="Work Hours" value={averages?.work || 0} subtitle="Hours / day" icon={Monitor} colorClass="text-amber-400" />
            <StatCard title="Phone Usage" value={`${averages?.phone || 0}m`} subtitle="Minutes / day" icon={Smartphone} colorClass="text-rose-400" />
            <StatCard title="Weight" value={`${latestWeight}kg`} subtitle={`${Number(weightChange) >= 0 ? '+' : ''}${weightChange}kg`} icon={Weight} colorClass="text-purple-400" />
          </div>

          <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-sm">
            <h3 className="text-lg font-semibold mb-6 flex items-center gap-2">
              <TrendingUp className="text-brand-400" size={20} /> Productivity Trends
            </h3>
            <div className="h-72 w-full">
              <ResponsiveContainer width="100%" height="100%">
                <AreaChart data={processedData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                  <defs>
                    <linearGradient id="colorProd" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient>
                    <linearGradient id="colorScore" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#10b981" stopOpacity={0.3}/><stop offset="95%" stopColor="#10b981" stopOpacity={0}/></linearGradient>
                  </defs>
                  <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                  <XAxis dataKey="formattedDate" stroke="#94a3b8" tick={{fontSize: 12}} />
                  <YAxis yAxisId="left" stroke="#94a3b8" tick={{fontSize: 12}} />
                  <YAxis yAxisId="right" orientation="right" stroke="#94a3b8" tick={{fontSize: 12}} />
                  <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', color: '#f1f5f9' }} labelFormatter={(label, payload) => payload && payload.length > 0 ? `Jalali: ${payload[0].payload.fullJalali}` : label} />
                  <Area yAxisId="left" type="monotone" dataKey="productivity" name="Productivity %" stroke="#3b82f6" fillOpacity={1} fill="url(#colorProd)" />
                  <Area yAxisId="right" type="monotone" dataKey="score" name="Total Score" stroke="#10b981" fillOpacity={1} fill="url(#colorScore)" />
                </AreaChart>
              </ResponsiveContainer>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-sm">
              <h3 className="text-lg font-semibold mb-6 flex items-center gap-2"><Activity className="text-amber-400" size={20} /> Activity Breakdown (Avg)</h3>
              <div className="h-64 w-full">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={processedData}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                    <XAxis dataKey="formattedDate" stroke="#94a3b8" tick={{fontSize: 10}} />
                    <YAxis stroke="#94a3b8" tick={{fontSize: 12}} />
                    <Tooltip cursor={{fill: '#334155', opacity: 0.2}} contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', color: '#f1f5f9' }} labelFormatter={(label, payload) => payload && payload.length > 0 ? `Jalali: ${payload[0].payload.fullJalali}` : label} />
                    <Legend />
                    <Bar dataKey="workHours" name="Work (Hrs)" stackId="a" fill="#f59e0b" radius={[4, 4, 0, 0]} />
                    <Bar dataKey="exerciseMinutes" name="Exercise (Min)" fill="#ef4444" radius={[4, 4, 0, 0]} />
                    <Bar dataKey="studyMinutes" name="Study (Min)" fill="#8b5cf6" radius={[4, 4, 0, 0]} />
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>

            <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-sm">
              <h3 className="text-lg font-semibold mb-6 flex items-center gap-2"><Weight className="text-purple-400" size={20} /> Weight Progression</h3>
              <div className="h-64 w-full">
                <ResponsiveContainer width="100%" height="100%">
                  <LineChart data={processedData}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                    <XAxis dataKey="formattedDate" stroke="#94a3b8" tick={{fontSize: 10}} />
                    <YAxis stroke="#94a3b8" tick={{fontSize: 12}} domain={['auto', 'auto']} />
                    <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', color: '#f1f5f9' }} labelFormatter={(label, payload) => payload && payload.length > 0 ? `Jalali: ${payload[0].payload.fullJalali}` : label} />
                    <Legend />
                    <Line type="monotone" dataKey="weight" name="Weight (kg)" stroke="#d946ef" strokeWidth={3} dot={{r: 4, fill: '#d946ef'}} activeDot={{r: 6}} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>

          <div className="bg-slate-800 border border-slate-700 rounded-xl shadow-sm overflow-hidden">
            <div className="p-6 border-b border-slate-700">
              <h3 className="text-lg font-semibold flex items-center gap-2"><Calendar className="text-brand-400" size={20} /> Detailed History</h3>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-400">
                <thead className="bg-slate-900/50 text-slate-200 uppercase font-semibold text-xs">
                  <tr>
                    <th className="px-6 py-4">Date</th>
                    <th className="px-6 py-4">Sleep</th>
                    <th className="px-6 py-4 text-amber-400">Work</th>
                    <th className="px-6 py-4 text-emerald-400">Exercise</th>
                    <th className="px-6 py-4 text-indigo-400">Study</th>
                    <th className="px-6 py-4 text-rose-400">Phone</th>
                    <th className="px-6 py-4 text-purple-400">Weight</th>
                    <th className="px-6 py-4 text-brand-400">Score</th>
                    <th className="px-6 py-4">Grade</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-700/50">
                  {historyData.map((row) => (
                    <tr key={row.id} className="hover:bg-slate-700/30 transition-colors">
                      <td className="px-6 py-4 font-medium text-slate-200">{row.fullJalali}</td>
                      <td className="px-6 py-4">{row.sleepHours}h</td>
                      <td className="px-6 py-4">{row.workHours}h</td>
                      <td className="px-6 py-4">{row.exerciseMinutes}m</td>
                      <td className="px-6 py-4">{row.studyMinutes}m</td>
                      <td className="px-6 py-4">{row.phoneMinutes}m</td>
                      <td className="px-6 py-4">{row.weight}kg</td>
                      <td className="px-6 py-4 font-bold text-slate-100">{row.score}</td>
                      <td className="px-6 py-4">
                        <span className={`px-2 py-1 rounded text-xs font-bold ${
                          row.grade === 'S' ? 'bg-yellow-500/20 text-yellow-400' :
                          row.grade === 'A' ? 'bg-emerald-500/20 text-emerald-400' :
                          row.grade === 'B' ? 'bg-brand-500/20 text-brand-400' :
                          row.grade === 'C' ? 'bg-slate-500/20 text-slate-400' :
                          'bg-rose-500/20 text-rose-400'
                        }`}>
                          {row.grade}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // --- EntryForm ---
    const EntryForm = ({ onSave, existingData }) => {
      const getTodayGregorian = () => new Date().toISOString().split('T')[0];
      const INITIAL_STATE = {
        id: '', date: getTodayGregorian(), jalaliDate: gregorianToJalaliString(getTodayGregorian()),
        sleepTime: '23:00', wakeTime: '07:00', sleepHours: 8, workHours: 0, exerciseMinutes: 0,
        studyMinutes: 0, phoneMinutes: 0, weight: 0, notes: ''
      };

      const [formData, setFormData] = useState(INITIAL_STATE);
      const [jalaliParts, setJalaliParts] = useState({ y: 1403, m: 1, d: 1 });

      useEffect(() => { if (existingData) setFormData(existingData); }, [existingData]);

      useEffect(() => {
        if (formData.date) {
          const [gY, gM, gD] = formData.date.split('-').map(Number);
          const { jy, jm, jd } = toJalaali(gY, gM, gD);
          if (jy !== jalaliParts.y || jm !== jalaliParts.m || jd !== jalaliParts.d) {
            setJalaliParts({ y: jy, m: jm, d: jd });
            setFormData(prev => ({ ...prev, jalaliDate: formatJalali(jy, jm, jd) }));
          }
        }
      }, [formData.date]);

      useEffect(() => {
        const hours = calculateDuration(formData.sleepTime, formData.wakeTime);
        setFormData(prev => ({ ...prev, sleepHours: hours }));
      }, [formData.sleepTime, formData.wakeTime]);

      const handleChange = (e) => {
        const { name, value, type } = e.target;
        setFormData(prev => ({ ...prev, [name]: type === 'number' ? parseFloat(value) || 0 : value }));
      };

      const handleJalaliChange = (field, value) => {
        const val = parseInt(value) || 0;
        const newParts = { ...jalaliParts, [field]: val };
        setJalaliParts(newParts);
        if (newParts.y > 1300 && newParts.m >= 1 && newParts.m <= 12 && newParts.d >= 1 && newParts.d <= 31) {
          const { gy, gm, gd } = toGregorian(newParts.y, newParts.m, newParts.d);
          const newGregorian = `${gy}-${gm.toString().padStart(2, '0')}-${gd.toString().padStart(2, '0')}`;
          if (!isNaN(gy)) {
            setFormData(prev => ({ ...prev, date: newGregorian, jalaliDate: formatJalali(newParts.y, newParts.m, newParts.d) }));
          }
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ ...formData, id: formData.date });
      };

      return (
        <form onSubmit={handleSubmit} className="max-w-2xl mx-auto bg-slate-800 p-6 md:p-8 rounded-xl border border-slate-700 shadow-lg">
          <div className="flex items-center gap-3 mb-8 border-b border-slate-700 pb-4">
            <div className="bg-brand-500/20 p-2 rounded-lg"><Calendar className="text-brand-400" size={24} /></div>
            <div><h2 className="text-xl font-bold text-white">Log Daily Activity</h2><p className="text-slate-400 text-sm">Record your metrics for today.</p></div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="col-span-full bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
              <label className="block text-sm font-medium text-slate-300 mb-3 flex items-center gap-2"><Calendar size={16} className="text-brand-400"/> Date Selection</label>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                <div>
                  <label className="block text-xs text-slate-500 mb-1">Gregorian Date</label>
                  <input type="date" name="date" value={formData.date} onChange={handleChange} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-brand-500 outline-none" required />
                </div>
                <div className="flex flex-col">
                  <label className="block text-xs text-slate-500 mb-1">Jalali Date (Y/M/D)</label>
                  <div className="flex gap-2">
                    <input type="number" placeholder="YYYY" value={jalaliParts.y} onChange={(e) => handleJalaliChange('y', e.target.value)} className="w-20 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-center" />
                    <span className="text-slate-600 self-center">/</span>
                    <input type="number" placeholder="MM" min="1" max="12" value={jalaliParts.m} onChange={(e) => handleJalaliChange('m', e.target.value)} className="w-14 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-center" />
                    <span className="text-slate-600 self-center">/</span>
                    <input type="number" placeholder="DD" min="1" max="31" value={jalaliParts.d} onChange={(e) => handleJalaliChange('d', e.target.value)} className="w-14 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-center" />
                  </div>
                </div>
              </div>
            </div>
            <div className="space-y-4 border border-slate-700/50 p-4 rounded-lg bg-slate-800/50">
              <h3 className="text-indigo-400 font-semibold flex items-center gap-2"><Clock size={16}/> Sleep Cycle</h3>
              <div><label className="block text-xs text-slate-400 mb-1">Bedtime</label><input type="time" name="sleepTime" value={formData.sleepTime} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" /></div>
              <div><label className="block text-xs text-slate-400 mb-1">Wake Time</label><input type="time" name="wakeTime" value={formData.wakeTime} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" /></div>
              <div className="text-right text-xs text-slate-500">Calculated: <span className="text-indigo-300 font-bold">{formData.sleepHours} hrs</span></div>
            </div>
            <div className="space-y-4 border border-slate-700/50 p-4 rounded-lg bg-slate-800/50">
              <h3 className="text-amber-400 font-semibold flex items-center gap-2"><Monitor size={16}/> Productivity</h3>
              <div><label className="block text-xs text-slate-400 mb-1">Work Hours</label><input type="number" step="0.5" name="workHours" value={formData.workHours} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" /></div>
              <div><label className="block text-xs text-slate-400 mb-1">Study (Min)</label><div className="relative"><BookOpen size={16} className="absolute left-3 top-2.5 text-slate-500" /><input type="number" name="studyMinutes" value={formData.studyMinutes} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 pl-10 text-white" /></div></div>
            </div>
            <div className="col-span-full md:col-span-1 border border-slate-700/50 p-4 rounded-lg bg-slate-800/50">
              <h3 className="text-emerald-400 font-semibold flex items-center gap-2"><Dumbbell size={16}/> Health</h3>
              <div><label className="block text-xs text-slate-400 mb-1">Exercise (Min)</label><div className="relative"><Dumbbell size={16} className="absolute left-3 top-2.5 text-slate-500" /><input type="number" name="exerciseMinutes" value={formData.exerciseMinutes} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 pl-10 text-white" /></div></div>
              <div className="mt-4"><label className="block text-xs text-slate-400 mb-1">Weight (kg)</label><div className="relative"><Scale size={16} className="absolute left-3 top-2.5 text-slate-500" /><input type="number" step="0.1" name="weight" value={formData.weight} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 pl-10 text-white" /></div></div>
            </div>
            <div className="col-span-full md:col-span-1 border border-slate-700/50 p-4 rounded-lg bg-slate-800/50">
              <h3 className="text-rose-400 font-semibold flex items-center gap-2"><Smartphone size={16}/> Distractions</h3>
              <div><label className="block text-xs text-slate-400 mb-1">Phone Usage (Min)</label><input type="number" name="phoneMinutes" value={formData.phoneMinutes} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" /></div>
            </div>
          </div>
          <button type="submit" className="w-full mt-8 bg-brand-500 hover:bg-brand-400 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-brand-500/20 transition-all flex items-center justify-center gap-2"><Save size={20} /> Save Daily Log</button>
        </form>
      );
    };

    // --- Main App ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [data, setData] = useState([]);
      const [config, setConfig] = useState(DEFAULT_CONFIG);

      // Load data
      useEffect(() => {
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((serverData) => {
              if (serverData && serverData.length > 0) setData(serverData);
              else setData(generateMockData(MOCK_HISTORY_LENGTH));
            })
            .withFailureHandler((err) => {
              console.error("Failed to load data", err);
              setData(generateMockData(MOCK_HISTORY_LENGTH));
            })
            .getData();
        } else {
          // Dev mode or fallback
          setData(generateMockData(MOCK_HISTORY_LENGTH));
        }
      }, []);

      const handleSaveEntry = (newEntry) => {
        setData(prev => {
          const index = prev.findIndex(d => d.date === newEntry.date);
          if (index >= 0) {
            const updated = [...prev];
            updated[index] = newEntry;
            return updated;
          }
          return [...prev, newEntry];
        });
        
        if (typeof google !== 'undefined' && google.script) {
          google.script.run.saveData(JSON.stringify(newEntry));
        }
        
        setActiveTab('dashboard');
      };

      const handleConfigChange = (e) => {
        const { name, value } = e.target;
        setConfig(prev => ({ ...prev, [name]: parseFloat(value) || 0 }));
      };

      const resetConfig = () => {
        setConfig(DEFAULT_CONFIG);
      };

      const NavItem = ({ tab, label, icon: Icon }) => (
        <button
          onClick={() => {
            setActiveTab(tab);
            setIsMobileMenuOpen(false);
          }}
          className={`flex items-center gap-3 px-4 py-3 rounded-lg w-full transition-colors ${
            activeTab === tab 
            ? 'bg-brand-500/10 text-brand-400 font-medium' 
            : 'text-slate-400 hover:bg-slate-800 hover:text-slate-100'
          }`}
        >
          <Icon size={20} />
          <span>{label}</span>
        </button>
      );

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 font-sans">
          
          {/* Sidebar (Desktop) */}
          <aside className="hidden md:flex flex-col w-64 bg-slate-900 border-r border-slate-800">
            <div className="p-6 border-b border-slate-800">
              <h1 className="text-xl font-bold bg-gradient-to-r from-brand-400 to-emerald-400 bg-clip-text text-transparent flex items-center gap-2">
                <BarChart3 className="text-brand-400"/>
                Nexus Tracker
              </h1>
            </div>
            <nav className="flex-1 p-4 space-y-2">
              <NavItem tab="dashboard" label="Dashboard" icon={LayoutDashboard} />
              <NavItem tab="log" label="Log Activity" icon={PlusCircle} />
              <NavItem tab="settings" label="Settings" icon={Settings} />
            </nav>
            <div className="p-4 border-t border-slate-800">
              <p className="text-xs text-slate-500 text-center">v2.1 • GAS Integrated</p>
            </div>
          </aside>

          {/* Mobile Header */}
          <div className="md:hidden fixed top-0 w-full bg-slate-900 border-b border-slate-800 z-50 px-4 py-3 flex justify-between items-center">
            <h1 className="font-bold text-lg text-brand-400">Nexus Tracker</h1>
            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-slate-300">
              {isMobileMenuOpen ? <X /> : <Menu />}
            </button>
          </div>

          {/* Mobile Menu Overlay */}
          {isMobileMenuOpen && (
            <div className="md:hidden fixed inset-0 bg-slate-950 z-40 pt-16 p-4">
              <nav className="space-y-4">
                <NavItem tab="dashboard" label="Dashboard" icon={LayoutDashboard} />
                <NavItem tab="log" label="Log Activity" icon={PlusCircle} />
                <NavItem tab="settings" label="Settings" icon={Settings} />
              </nav>
            </div>
          )}

          {/* Main Content Area */}
          <main className="flex-1 overflow-y-auto w-full pt-16 md:pt-0">
            <div className="max-w-7xl mx-auto p-4 md:p-8">
              
              {activeTab === 'dashboard' && (
                <div className="animate-fade-in">
                  <header className="mb-8">
                    <h2 className="text-3xl font-bold text-white mb-2">Welcome Back</h2>
                    <p className="text-slate-400">Here is your daily productivity analysis.</p>
                  </header>
                  <Dashboard data={data} config={config} />
                </div>
              )}

              {activeTab === 'log' && (
                <div className="animate-fade-in">
                  <EntryForm onSave={handleSaveEntry} />
                </div>
              )}

              {activeTab === 'settings' && (
                <div className="animate-fade-in max-w-2xl mx-auto bg-slate-800 p-8 rounded-xl border border-slate-700">
                  <div className="flex items-center gap-4 mb-8">
                    <div className="p-3 bg-brand-500/20 rounded-lg">
                      <Settings className="w-6 h-6 text-brand-400" />
                    </div>
                    <div>
                      <h3 className="text-xl font-bold">Scoring Configuration</h3>
                      <p className="text-slate-400 text-sm">Adjust how your productivity score is calculated.</p>
                    </div>
                  </div>
                  
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div>
                        <label className="block text-sm font-medium text-slate-300 mb-2">Work Weight (Points/Hr)</label>
                        <input 
                          type="number" 
                          name="workWeight"
                          value={config.workWeight}
                          onChange={handleConfigChange}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-300 mb-2">Daily Target Score</label>
                        <input 
                          type="number" 
                          name="dailyTargetScore"
                          value={config.dailyTargetScore}
                          onChange={handleConfigChange}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-300 mb-2">Exercise Weight (Pts/Min)</label>
                        <input 
                          type="number" 
                          name="exerciseWeight"
                          value={config.exerciseWeight}
                          onChange={handleConfigChange}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-300 mb-2">Study Weight (Pts/Min)</label>
                        <input 
                          type="number" 
                          name="studyWeight"
                          value={config.studyWeight}
                          onChange={handleConfigChange}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                       <div>
                        <label className="block text-sm font-medium text-slate-300 mb-2">Sleep Target (Hours)</label>
                        <input 
                          type="number" 
                          name="sleepTarget"
                          value={config.sleepTarget}
                          onChange={handleConfigChange}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                       <div>
                        <label className="block text-sm font-medium text-slate-300 mb-2">Phone Penalty (Pts/Min)</label>
                        <input 
                          type="number" 
                          name="phonePenalty"
                          value={config.phonePenalty}
                          onChange={handleConfigChange}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-rose-500"
                        />
                      </div>
                    </div>

                    <div className="pt-6 border-t border-slate-700 flex justify-between">
                      <button 
                        onClick={resetConfig}
                        className="px-4 py-2 text-slate-400 hover:text-white flex items-center gap-2 hover:bg-slate-700 rounded-lg transition-colors"
                      >
                        <RotateCcw size={16} /> Reset to Default
                      </button>
                      <button 
                        onClick={() => setActiveTab('dashboard')}
                        className="px-6 py-2 bg-brand-500 text-white font-bold rounded-lg hover:bg-brand-400 flex items-center gap-2 shadow-lg shadow-brand-500/20"
                      >
                        <Save size={16} /> Save & View
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
